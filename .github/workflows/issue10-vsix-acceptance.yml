name: Issue 10 - packaged VSIX and companion acceptance evidence

on:
  pull_request:
    paths:
      - '.github/workflows/issue10-vsix-acceptance.yml'
      - 'scripts/issue10-*.cjs'
      - 'docs/issue10-artifact-investigation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-host:
    name: Linux source/VSIX and real Extension Host comparison
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VALIDATOR_BASE_SHA: 4a0282e93b979345374076fb0adc60c7faf6af99
      HELPER12_SHA: ec6ac6b774f119320d2f623b012f91c2d0215057
      HELPER16_SHA: 3c41101c177afff639624a61bb004402a613edcd
    steps:
      - name: Checkout Validator from this PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Helper PR 12 exact head (unmerged)
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: ec6ac6b774f119320d2f623b012f91c2d0215057
          path: _helper12

      - name: Checkout Helper PR 16 acceptance assets (unmerged)
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: 3c41101c177afff639624a61bb004402a613edcd
          path: _helper16

      - name: Relocate external PR checkouts outside the Validator TypeScript project
        run: |
          mv _helper12 "$RUNNER_TEMP/issue10-helper12"
          mv _helper16 "$RUNNER_TEMP/issue10-helper16"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate acceptance scripts and Helper fixtures
        run: |
          node --check scripts/issue10-vsix-audit.cjs
          node --check scripts/issue10-host.cjs
          node "$RUNNER_TEMP/issue10-helper16/test/acceptance/check-fixtures.mjs"

      - name: Build exactly checked-out Validator source
        run: |
          npm ci
          npm run compile
          mkdir -p issue10-dist issue10-evidence
          ./node_modules/.bin/vsce package --no-dependencies --out "$PWD/issue10-dist/validator-built.vsix"

      - name: Package unmerged Helper PR 12, without changing its branch
        run: |
          npm ci --prefix "$RUNNER_TEMP/issue10-helper12"
          npm run compile --prefix "$RUNNER_TEMP/issue10-helper12"
          cd "$RUNNER_TEMP/issue10-helper12"
          "$GITHUB_WORKSPACE/node_modules/.bin/vsce" package --no-dependencies --out "$GITHUB_WORKSPACE/issue10-dist/helper12.vsix"

      - name: Download published GitHub release VSIX v0.2.6
        run: |
          if ! curl --fail --location --show-error --silent --retry 3 \
              "https://github.com/Chain-Frost/tuflow_validator/releases/download/v0.2.6/tuflow-path-validator-0.2.6.vsix" \
              --output issue10-dist/release-v0.2.6.vsix; then
            rm -f issue10-dist/release-v0.2.6.vsix
            echo "Published VSIX unavailable: mark historical artifact inspection/host run blocked."
          fi

      - name: Audit packaged compiled output, versions and SHA-256 hashes
        run: |
          node scripts/issue10-vsix-audit.cjs \
            issue10-dist/validator-built.vsix \
            issue10-dist/release-v0.2.6.vsix

      - name: Run real isolated VS Code Extension Host profiles using Helper PR 16
        run: |
          xvfb-run -a node scripts/issue10-host.cjs \
            issue10-dist/validator-built.vsix \
            issue10-dist/release-v0.2.6.vsix \
            issue10-dist/helper12.vsix \
            "$RUNNER_TEMP/issue10-helper16"

      - name: Upload test reports and artifact provenance only (no VSIX binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-vsix-host-evidence-linux
          path: |
            issue10-evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  windows-host:
    name: Windows installed VSIX and Extension Host profiles
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VALIDATOR_BASE_SHA: 4a0282e93b979345374076fb0adc60c7faf6af99
      HELPER12_SHA: ec6ac6b774f119320d2f623b012f91c2d0215057
      HELPER16_SHA: 3c41101c177afff639624a61bb004402a613edcd
      ISSUE10_EVIDENCE_DIR: issue10-windows-evidence
    steps:
      - name: Checkout Validator from PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest verified Helper PR 12
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: ec6ac6b774f119320d2f623b012f91c2d0215057
          path: _helper12

      - name: Checkout Helper PR 16 acceptance runner
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: 3c41101c177afff639624a61bb004402a613edcd
          path: _helper16

      - name: Keep Helper TypeScript outside Validator compilation
        shell: pwsh
        run: |
          Move-Item -LiteralPath _helper12 -Destination (Join-Path $env:RUNNER_TEMP issue10-helper12)
          Move-Item -LiteralPath _helper16 -Destination (Join-Path $env:RUNNER_TEMP issue10-helper16)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and compile source on Windows
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/issue10-host.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/issue10-vsix-audit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $env:RUNNER_TEMP "issue10-helper16/test/acceptance/check-fixtures.mjs")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path issue10-dist, issue10-windows-evidence | Out-Null
          & ".\node_modules\.bin\vsce.cmd" package --no-dependencies --out "$env:GITHUB_WORKSPACE\issue10-dist\validator-built.vsix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and package Helper PR 12 on Windows
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP "issue10-helper12"
          npm ci --prefix $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run compile --prefix $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $helper
          & "$env:GITHUB_WORKSPACE\node_modules\.bin\vsce.cmd" package --no-dependencies --out "$env:GITHUB_WORKSPACE\issue10-dist\helper12.vsix"
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Download public historical release VSIX (not Marketplace)
        shell: pwsh
        run: |
          $url = "https://github.com/Chain-Frost/tuflow_validator/releases/download/v0.2.6/tuflow-path-validator-0.2.6.vsix"
          $target = "issue10-dist\release-v0.2.6.vsix"
          try { Invoke-WebRequest -Uri $url -OutFile $target -ErrorAction Stop }
          catch { Write-Host "Historical VSIX download blocked: $_"; Remove-Item $target -ErrorAction SilentlyContinue }

      - name: Inspect Windows-packaged source and historical release
        shell: pwsh
        run: |
          node scripts/issue10-vsix-audit.cjs issue10-dist/validator-built.vsix issue10-dist/release-v0.2.6.vsix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native Windows VS Code Extension Host with isolated installed extensions
        shell: pwsh
        run: |
          $runner = Join-Path $env:RUNNER_TEMP "issue10-helper16"
          node scripts/issue10-host.cjs issue10-dist/validator-built.vsix issue10-dist/release-v0.2.6.vsix issue10-dist/helper12.vsix $runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows real-host evidence (no VSIX binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-vsix-host-evidence-windows
          path: issue10-windows-evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  integrated-a-b:
    name: A1/A2/B stacked source versus packaged VSIX (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VALIDATOR_BASE_SHA: 4a0282e93b979345374076fb0adc60c7faf6af99
      HELPER12_SHA: ec6ac6b774f119320d2f623b012f91c2d0215057
      HELPER16_SHA: 3c41101c177afff639624a61bb004402a613edcd
      ISSUE10_EVIDENCE_DIR: issue10-integrated-evidence
    steps:
      - name: Checkout issue 10 independent test scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout actual B PR 21 head stacked on A2 / A1
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow_validator
          ref: c75d65188d631d864fb8439d3b99f3b907a3e182
          path: _integrated_ab

      - name: Checkout Helper PR 12
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: ec6ac6b774f119320d2f623b012f91c2d0215057
          path: _helper12

      - name: Checkout Helper PR 16 acceptance runner
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: 3c41101c177afff639624a61bb004402a613edcd
          path: _helper16

      - name: Preserve exact stacked commit and isolate TypeScript compilation roots
        run: |
          mv _integrated_ab "$RUNNER_TEMP/issue10-integrated"
          mv _helper12 "$RUNNER_TEMP/issue10-helper12"
          mv _helper16 "$RUNNER_TEMP/issue10-helper16"
          echo "INTEGRATED_AB_SHA=$(git -C "$RUNNER_TEMP/issue10-integrated" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ISSUE10_COMPILED_PARSER=$RUNNER_TEMP/issue10-integrated/out/pathParsing.js" >> "$GITHUB_ENV"
          mkdir -p issue10-dist issue10-integrated-evidence

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked tooling, and compile/package stacked A1/A2/B source
        run: |
          npm ci
          npm ci --prefix "$RUNNER_TEMP/issue10-integrated"
          npm run compile --prefix "$RUNNER_TEMP/issue10-integrated"
          cd "$RUNNER_TEMP/issue10-integrated"
          "$GITHUB_WORKSPACE/node_modules/.bin/vsce" package --no-dependencies \
            --out "$GITHUB_WORKSPACE/issue10-dist/integrated-ab.vsix"

      - name: Compile/package Helper PR 12 for identical companion identity
        run: |
          npm ci --prefix "$RUNNER_TEMP/issue10-helper12"
          npm run compile --prefix "$RUNNER_TEMP/issue10-helper12"
          cd "$RUNNER_TEMP/issue10-helper12"
          "$GITHUB_WORKSPACE/node_modules/.bin/vsce" package --no-dependencies \
            --out "$GITHUB_WORKSPACE/issue10-dist/helper12.vsix"

      - name: Download historical public release for the negative control
        run: |
          if ! curl --fail --location --show-error --silent --retry 3 \
              "https://github.com/Chain-Frost/tuflow_validator/releases/download/v0.2.6/tuflow-path-validator-0.2.6.vsix" \
              --output issue10-dist/release-v0.2.6.vsix; then
            rm -f issue10-dist/release-v0.2.6.vsix
            echo "Published VSIX unavailable: historical comparison is blocked."
          fi

      - name: Audit exact integrated compiled JS, package manifests and hashes
        run: |
          node scripts/issue10-vsix-audit.cjs \
            issue10-dist/integrated-ab.vsix \
            issue10-dist/release-v0.2.6.vsix

      - name: Repeat issue 10 packaged Extension Host profiles against A/B integration
        run: |
          xvfb-run -a node scripts/issue10-host.cjs \
            issue10-dist/integrated-ab.vsix \
            issue10-dist/release-v0.2.6.vsix \
            issue10-dist/helper12.vsix \
            "$RUNNER_TEMP/issue10-helper16"

      - name: Upload exact integrated A/B profile results (no binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-integrated-ab-evidence-linux
          path: issue10-integrated-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
