name: Temporary E2 lockfile generation

# This isolated one-time development workflow is deleted before E2 review.
on:
  push:
    branches:
      - chore/issue-4-e2-toolchain

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve declared dev dependencies into npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify reproducible clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify compilation and ESLint after upgrades
        run: |
          npm run compile
          npm run lint

      - name: Commit generated lockfile to isolated E2 branch
        shell: bash
        run: |
          git diff --check
          git add package-lock.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: regenerate lockfile for compatible E2 toolchain'
          git push origin HEAD:chore/issue-4-e2-toolchain
