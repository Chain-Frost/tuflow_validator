name: Extension tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: VS Code ${{ matrix.vscode }} integration and VSIX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        vscode:
          - '1.74.0'
          - stable
    env:
      TPV_VSCODE_VERSION: ${{ matrix.vscode }}
      # A fixed, reviewed Helper snapshot makes coexistence reproducible.
      TPV_HELPER_SOURCE_SHA: 38ebb604697b21d7b45929e1ec989dad8559c94a
      TPV_HELPER_VSIX: .compatibility/helper/tuflow-helper.vsix

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for standard-library VSIX inspection
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked dependencies
        run: npm ci

      # npm test runs pretest (TypeScript compilation + ESLint) before
      # starting the actual VS Code extension-host integration suite.
      - name: Compile, lint and run VS Code integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Compile, lint and run VS Code integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm test

      # This is a CI-only, platform-neutral packaging command. Publishing
      # workflows and the existing release/package wrapper are unchanged.
      - name: Package tested source
        run: npm run package:vsix:ci

      - name: Verify VSIX archive and runtime boundary
        run: python scripts/verify-vsix.py validator-ci.vsix

      - name: Check out pinned Helper for minimum-version coexistence
        uses: actions/checkout@v4
        with:
          repository: Chain-Frost/tuflow-vscode
          ref: 38ebb604697b21d7b45929e1ec989dad8559c94a
          path: .compatibility/helper

      - name: Build and verify the pinned Helper VSIX
        working-directory: .compatibility/helper
        run: |
          npm ci
          npm run package:vsix

      - name: Test installed Validator and Helper coexistence (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:compatibility

      - name: Test installed Validator and Helper coexistence (Windows)
        if: runner.os == 'Windows'
        run: npm run test:compatibility

      - name: Retain actual editor/runtime and installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.vscode }}
          path: .compatibility/evidence/*.json
          if-no-files-found: warn
          retention-days: 30
