name: Extension tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, lint and VS Code integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run compilation, lint and VS Code tests
        run: xvfb-run -a npm test

      - name: Build and inspect VSIX
        run: |
          npx --no-install vsce package --no-dependencies --out validator-test.vsix
          python scripts/verify-vsix.py validator-test.vsix

  windows:
    name: Windows integration tests and VSIX
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile, lint and VS Code integration tests
        run: |
          npm test

      - name: Build and inspect VSIX
        run: |
          npx --no-install vsce package --no-dependencies --out validator-test.vsix
          python scripts/verify-vsix.py validator-test.vsix
