name: Extension tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: VS Code integration and VSIX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python for standard-library VSIX inspection
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release guards without publishing
        run: npm run test:release

      # npm test runs pretest (TypeScript compilation + ESLint) before
      # starting the actual VS Code extension-host integration suite.
      - name: Compile, lint and run VS Code integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Compile, lint and run VS Code integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm test

      # This is a CI-only, platform-neutral packaging command. Publishing
      # workflows and the existing release/package wrapper are unchanged.
      - name: Package tested source
        run: npm run package:vsix:ci

      - name: Verify VSIX archive and runtime boundary
        run: python scripts/verify-vsix.py validator-ci.vsix
