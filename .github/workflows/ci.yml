name: Extension tests

on:
  pull_request:
  push:
    branches:
      - fix/issue-2-command-aware-validation

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, lint and VS Code integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compilation, lint and VS Code tests
        run: xvfb-run -a npm test
